<title>Buscador Armónico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
@font-face{font-family:'Academico';src:url(fonts/academico.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Academico';src:url(fonts/academico-bold.woff2) format('woff2');font-weight:700}
/* Layout: una columna de trabajo (consulta → resultados) y un panel de partitura
   que se pega debajo en móvil y a la derecha en pantallas anchas. */
:root{
  --bg:#f7f6f2; --panel:#ffffff; --fg:#1d2126; --muted:#5d6670; --line:#dcd9d1;
  --accent:#1f5f6b; --accent-ink:#ffffff; --accent-soft:#e3eeef; --hl:#fff2c2; --enh:#8a3b7a; --dir:#9a5a12;
  --int:#6b4fa0; --fun:#2f6b3a;
  --display:"Literata",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181b; --panel:#1d2126; --fg:#e8e6e0; --muted:#9aa3ab; --line:#2f353b;
  --accent:#6fb7c2; --accent-ink:#0f1a1c; --accent-soft:#1c2f33; --hl:#4a3f12; --enh:#d99ac9; --dir:#e0a85a;
  --int:#b9a4e6; --fun:#8fd19c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181b; --panel:#1d2126; --fg:#e8e6e0; --muted:#9aa3ab; --line:#2f353b;
  --accent:#6fb7c2; --accent-ink:#0f1a1c; --accent-soft:#1c2f33; --hl:#4a3f12; --enh:#d99ac9; --dir:#e0a85a;
  --int:#b9a4e6; --fun:#8fd19c; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
header{max-width:1240px;margin:0 auto;padding-block:28px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font:600 26px/1.1 var(--display);margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:14px}
header p b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
main{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
main:has(#vista[hidden]),body:has(#vista[hidden]) header,body:has(#vista[hidden]) footer,body:has(#vista[hidden]) #colecciones{max-width:760px}
@media (min-width:980px){main:not(:has(#vista[hidden])){grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  #vista{position:sticky;top:12px}}

select{font:14px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);max-width:100%}
select:focus,button:focus-visible,.fila:focus-visible,input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);padding:4px 2px;cursor:pointer}
label.chk input{accent-color:var(--accent)}

.buscador{position:relative}
.caja{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:text;min-height:52px}
.caja:focus-within{outline:2px solid var(--accent);outline-offset:1px}
#chips{display:contents}
.caja input[type=search]{flex:1 1 180px;min-width:120px;font:17px var(--body);padding:6px 4px;border:0;background:transparent;color:var(--fg);outline:none}
.caja input[type=search]::-webkit-search-cancel-button{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;font:14px/1.2 var(--body);padding:5px 4px 5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--fg);border:1px solid transparent}
.chip.principal{background:var(--accent);color:var(--accent-ink)}
.chip .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .tp{font-size:11px;opacity:.75;margin-right:2px}
.chip button{border:0;background:none;color:inherit;font-size:16px;line-height:1;cursor:pointer;padding:0 6px;border-radius:999px;opacity:.75}
.chip button:hover{opacity:1}
.limpiar{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px;margin-left:auto}
.ajustes{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-top:8px;font-size:14px;color:var(--muted)}
.ajustes select{padding:5px 8px;font-size:13.5px}
.ajustes .num{width:64px;font:14px var(--body);padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.limite{margin:-4px 0 8px}
#inicio{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;position:relative}
#inicio:empty{display:none}
#inicio details{position:static}
#inicio summary{list-style:none;font:14px var(--body);padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--fg);cursor:pointer;user-select:none;white-space:nowrap}
#inicio summary::-webkit-details-marker{display:none}
#inicio summary::after{content:" ▾";color:var(--muted);font-size:12px}
#inicio summary:hover,#inicio details[open] summary{border-color:var(--accent);color:var(--accent)}
#inicio .menu{position:absolute;z-index:15;top:calc(100% + 6px);left:0;width:min(340px,100%);padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);display:grid;gap:2px}
#inicio .menu.ancho{width:min(560px,100%)}
#inicio .menu button{font:14px var(--body);text-align:left;padding:7px 10px;border:0;border-radius:6px;background:none;color:var(--fg);cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
#inicio .menu button:hover,#inicio .menu button:focus-visible{background:var(--accent-soft);outline:none}
#inicio .menu button.mono{font-family:var(--mono);font-size:13.5px}
#inicio .menu .c,#inicio .menu .r{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#inicio .tabs{display:flex;flex-wrap:wrap;gap:4px;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
#inicio .tabs button{font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:999px}
#inicio .tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#inicio .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px}
#inicio .filtro{font:14px var(--body);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);margin-bottom:4px}
#inicio .lista{max-height:min(320px,50vh);overflow-y:auto;display:grid;gap:2px}
#inicio .sec{display:grid;gap:1px}
#inicio .sec h3{font:500 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 10px 4px}
#inicio .tono{grid-template-columns:1fr auto auto;gap:8px;align-items:start}
#inicio .tono .col{display:grid;gap:2px}
#inicio .tono .notas{grid-template-columns:repeat(4,1fr)}
#inicio .tono .col button{justify-content:center;border:1px solid var(--line)}
#inicio .tono .alts button{font-size:17px;min-width:40px}
#inicio .tono button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#inicio .tono .modos button{border-color:var(--accent);color:var(--accent);min-width:76px}
#inicio .pista{font-size:12.5px;color:var(--muted);margin:4px 10px 2px;grid-column:1/-1}
#sugerencias .tipo-s{grid-row:1;grid-column:2;align-self:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
#sugerencias{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:min(460px,62vh);overflow-y:auto}
#sugerencias li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;padding:7px 10px;border-radius:6px;cursor:pointer}
#sugerencias li[aria-selected=true]{background:var(--accent-soft)}
#sugerencias .n{font-size:15px;color:var(--fg)}
#sugerencias .n mark{background:none;color:var(--accent);font-weight:600}
#sugerencias .d{grid-column:1;font-size:12.5px;color:var(--muted)}
#sugerencias .c{grid-row:1;grid-column:2;align-self:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
#sugerencias .g{font:500 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px;cursor:default;display:block}
#sugerencias .vacia{color:var(--muted);font-size:14px;cursor:default;display:block}

.opciones{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;margin-top:10px;font-size:14px}
details.filtros summary{cursor:pointer;color:var(--muted);width:max-content;max-width:100%}
details.filtros summary b{color:var(--accent);font-weight:500}
details.filtros[open]{flex-basis:100%}
details.filtros .cuerpo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.mostrar{display:flex;flex-wrap:wrap;align-items:center;gap:0 12px;color:var(--muted)}
.mostrar .et{font-size:13px}
.mostrar .rom{color:var(--fg)} .mostrar .int{color:var(--int)} .mostrar .fun{color:var(--fun)}

.estado:empty{display:none}
.estado{margin:14px 0 8px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.estado strong{color:var(--fg);font-weight:500}
.estado code{font:13px var(--mono);background:var(--accent-soft);color:var(--fg);padding:1px 6px;border-radius:4px}
.leyenda{font-size:12.5px;color:var(--muted);margin:-2px 0 8px}
.leyenda b{color:var(--fun);font-weight:500}

.tabla{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.tabla .wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font:500 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td.cif{min-width:150px}
td.obra{max-width:300px}
td.obra .t{display:block}
td.obra .c{display:block;color:var(--muted);font-size:13px}
.lin{display:block;white-space:normal}
.lin.rom{font:13.5px var(--mono);color:var(--fg)}
.lin.int{font:12.5px var(--mono);color:var(--int)}
.lin.fun{font:13.5px var(--body);color:var(--fun)}
.lin .sep{color:var(--muted);opacity:.6;padding:0 2px}
.resumen{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.fila{cursor:pointer}
.fila:hover td{background:var(--accent-soft)}
.fila[aria-selected=true] td{background:var(--hl)}
.pag{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
button.btn{font:14px var(--body);padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.btn:disabled{opacity:.45;cursor:default}

.tipo{display:inline-block;font:500 11px/1.6 var(--body);letter-spacing:.04em;text-transform:uppercase;padding:0 7px;border-radius:999px;margin:2px 0;vertical-align:1px;border:1px solid currentColor}
.t-dia{color:var(--muted)} .t-cro{color:var(--accent)} .t-enh{color:var(--enh)} .t-dir{color:var(--dir)}
.det{display:block;font:12.5px var(--body);color:var(--muted);white-space:normal;margin-top:2px}

#vista{border:1px solid var(--line);border-radius:8px;background:var(--panel);min-height:260px;display:flex;flex-direction:column;min-width:0}
#vista .cab{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#vista .cab h3{font:600 18px/1.25 var(--display);margin:0;text-wrap:balance}
#vista .cab .sub{color:var(--muted);font-size:14px}
#vista .herr{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
#vista .herr input[type=range]{width:110px;accent-color:var(--accent)}
#vista .herr a{color:var(--accent)}
#partitura{padding:10px 12px 14px;overflow-x:auto;background:#fff;color:#000}
#partitura svg{max-width:100%;height:auto;display:block}
#partitura.desliza{position:relative}
#partitura.desliza::before{content:'desliza para ver más →';position:sticky;left:0;display:block;font:12px var(--body);color:#5d6670;margin:0 0 4px}
#partitura .vacio{font-family:var(--body);color:#5d6670;padding:40px 16px;text-align:center;font-size:14px}
:root[data-theme="dark"] #partitura{background:#f3f1ec}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #partitura{background:#f3f1ec}}
#tira{border-top:1px solid var(--line);overflow-x:auto;border-radius:0 0 8px 8px}
#tira table{min-width:0;width:auto}
#tira th,#tira td{padding:5px 9px;border-bottom:0;white-space:nowrap;text-align:center}
#tira th{font:500 11px var(--body);letter-spacing:.02em;text-transform:none;color:var(--muted);border-bottom:1px solid var(--line)}
#tira .nc{border-left:1px solid var(--line)}
#tira td.rot{font:500 10.5px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;position:sticky;left:0;background:var(--panel)}
#tira tr.rom td{font:14px var(--mono)} #tira tr.int td{font:13px var(--mono);color:var(--int)} #tira tr.fun td{font:14px var(--body);color:var(--fun)}
#tira td.foco{background:var(--hl)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.grupo td{background:var(--panel);border-bottom:1px solid var(--line);cursor:pointer;padding-left:26px}
tr.comp td{cursor:pointer;background:var(--bg);font-size:14.5px}
tr.comp .gt{font-weight:600}
tr.comp:hover td,.grupo:hover td{background:var(--accent-soft)}
.fl{display:inline-block;width:12px;color:var(--muted)}
.resumen-b{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 14px;margin-bottom:12px;display:grid;gap:6px}
.resumen-b .tit{margin:0 0 2px;font-size:14px;color:var(--muted)}
.resumen-b .tit strong{color:var(--fg);font-weight:600}
.fila-b{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:baseline}
.fila-b .et{font:500 10.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fila-b>div{display:flex;flex-wrap:wrap;gap:2px 4px}
.fila-b button{display:inline-flex;align-items:center;gap:6px;font:13.5px var(--body);padding:3px 8px;border:0;border-radius:6px;background:none;color:var(--fg);cursor:pointer}
.fila-b button:hover{background:var(--accent-soft)}
.fila-b .b{display:inline-block;height:8px;border-radius:2px;background:var(--accent);opacity:.75}
.fila-b .c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fila-b .mas-b{color:var(--accent)}
@media (max-width:560px){.fila-b{grid-template-columns:1fr}}
#destacados{margin-bottom:12px}
#destacados .et{font:500 10.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
#destacados .tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
#estado:has(~ #resumen:not([hidden])){display:none}
@media (max-width:600px){.tabla table{min-width:0} td.cif{min-width:0} th:nth-child(3),td.num+td.num{display:none}
  tr.comp td,.grupo td{white-space:normal}}
#destacados button{display:grid;gap:2px;text-align:left;font:13px var(--body);padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);cursor:pointer;min-width:0}
#destacados button:hover{border-color:var(--accent)}
#destacados button[aria-pressed=true]{background:var(--hl);border-color:var(--accent)}
#destacados .cp{font-weight:600;font-size:14px}
#destacados .ob{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#destacados .dn{font-size:12.5px}
#destacados code{font:12.5px var(--mono)}
.grupo .gt{font-weight:500}
.grupo .gs{color:var(--muted);font-size:13px}
tr.hijo td:first-child{padding-left:44px}
tr.mas td{color:var(--accent);font-size:13px;cursor:pointer;padding-top:4px;padding-bottom:6px}
.fu{display:inline-block;font:500 10.5px/1.6 var(--body);letter-spacing:.04em;padding:0 6px;border-radius:4px;margin-right:4px;vertical-align:1px;border:1px solid var(--line);color:var(--muted)}
.fu.wir{color:var(--accent);border-color:currentColor}
.fu.dcml{color:var(--enh);border-color:currentColor}
.fu.anot{color:var(--fun);border-color:currentColor}
#selAnalisis{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);align-items:center}
#selAnalisis button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#ficha{border-top:1px solid var(--line);font-size:13.5px}
#ficha summary{padding:10px 16px;cursor:pointer;color:var(--muted)}
#ficha .cuerpo{padding:0 16px 14px;display:grid;gap:10px}
#ficha dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;margin:0}
#ficha dt{color:var(--muted)} #ficha dd{margin:0;overflow-wrap:anywhere}
#ficha a{color:var(--accent)}
.ctx{font:13.5px var(--mono);line-height:1.9;overflow-wrap:anywhere}
.ctx .f{background:var(--hl);padding:1px 4px;border-radius:3px}
.ctx .k{color:var(--muted);font-family:var(--body);font-style:italic;font-size:12.5px}
#comparar{border-top:1px solid var(--line);overflow-x:auto}
#comparar table{min-width:0}
#comparar td,#comparar th{font-size:13px;padding:5px 10px}
#comparar td.dif{background:var(--hl)}
#comparar .res{padding:8px 16px;color:var(--muted);font-size:13px}
form.guardar{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:6px}
form.guardar input,form.guardar textarea,form.guardar select{font:14px var(--body);padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);width:100%}
.estrellas button{border:0;background:none;font-size:20px;cursor:pointer;color:var(--line);padding:0 2px}
.estrellas button.on{color:#d4a017}
#colecciones{max-width:1240px;margin:0 auto 18px}
#colecciones h2{font:600 18px var(--display);margin:6px 0 10px}
.col-item{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:3px}
.col-item .acc{display:flex;gap:8px;margin-top:4px}
header .der{margin-left:auto}
footer{max-width:1240px;margin:28px auto 0;color:var(--muted);font-size:13px;line-height:1.5}
footer a{color:var(--accent)}
</style>

<header>
  <h1>Buscador armónico</h1>
  <button class="btn der" id="verColecciones" type="button" hidden>Colecciones</button>
</header>
<section id="colecciones" hidden></section>

<main>
<section style="min-width:0">
  <form id="form" autocomplete="off">
    <div class="buscador">
      <div class="caja" id="caja">
        <span id="chips"></span>
        <input type="search" id="q" placeholder="Procedimiento, compositor, tonalidad…" role="combobox" aria-expanded="false" aria-controls="sugerencias" aria-autocomplete="list" aria-label="Buscar">
        <button type="button" class="limpiar" id="limpiar" aria-label="Borrar la búsqueda" hidden>×</button>
      </div>
      <ul id="sugerencias" role="listbox" hidden></ul>
    </div>

<script>
(async function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[,;.:]/g,' ').replace(/\s+/g,' ');
const META=await (await fetch('data/meta.json')).json();
const OBRAS=await (await fetch('data/obras.json')).json();
const porId=new Map(OBRAS.map(o=>[o.id,o]));
const porMov=new Map(); for(const o of OBRAS){if(!porMov.has(o.m))porMov.set(o.m,[]);porMov.get(o.m).push(o)}
const porClave=new Map(OBRAS.map(o=>[o.src.clave,o]));
const NFUENTE={wir:'When in Rome',dcml:'DCML'};
const badge=f=>`<span class="fu ${f}">${f==='wir'?'WiR':'DCML'}</span>`;
const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};

// ============ filtros ============
const apellido=c=>c.split(' ').pop();
// «Bach, Johann Sebastian»: así la lista se lee en orden alfabético
const porApellido=c=>{const p=c.split(' ');return p.length>1?p[p.length-1]+', '+p.slice(0,-1).join(' '):c};
const comps=[...new Set(OBRAS.map(o=>o.c))].sort((a,b)=>porApellido(a).localeCompare(porApellido(b),'es',{sensitivity:'base'}));
for(const c of comps){const o=document.createElement('option');o.value=c;o.textContent=porApellido(c);$('#compositor').append(o)}
const EPOCAS=['Renacimiento','Barroco','Clasicismo','Romanticismo','Siglo XX'];
for(const e of EPOCAS.filter(e=>OBRAS.some(o=>o.per===e))){const o=document.createElement('option');o.value=e;o.textContent=e;$('#epoca').append(o)}
const TONOS=['C','c','C#','c#','D-','D','d','E-','e-','E','e','F','f','F#','f#','G-','G','g','g#','A-','A','a','B-','b-','B','b'];
function rellenarObras(){
  const sel=$('#obraSel'), comp=$('#compositor').value; sel.innerHTML='<option value="">Todas sus obras</option>';
  sel.hidden=!comp; if(!comp) return;
  const vistas=new Map(); for(const o of OBRAS) if(o.c===comp&&!vistas.has(o.w)) vistas.set(o.w,o.ob);
  for(const [w,t] of [...vistas].sort((a,b)=>a[1].localeCompare(b[1],'es',{numeric:true}))){const op=document.createElement('option');op.value=w;op.textContent=t;sel.append(op)}
}
const filtros=()=>({comp:$('#compositor').value,obra:+$('#obraSel').value||0,fuente:$('#fuente').value,per:$('#epoca').value,
  tono:$('#tonalidad').value,modo:$('#modo').value,lim:$('#unaPorObra').checked?2:Infinity,L:+$('#longitud').value});
const pasaObra=(o,f)=>!!o&&!(f.comp&&o.c!==f.comp)&&!(f.obra&&o.w!==f.obra)&&!(f.fuente&&o.f!==f.fuente)&&!(f.per&&o.per!==f.per);
const pasaTono=(t,f)=>!t||(!(f.tono&&t!==f.tono)&&!(f.modo&&((t[0]===t[0].toUpperCase())?'M':'m')!==f.modo));

// ============ cifrados: romano → interválico y funcional ============
function parseRN(fig){
  const f=String(fig).replace(/\[[^\]]*\]/g,'');
  const partes=f.split('/'); let main=partes[0], j=1;
  while(j<partes.length&&/^\d/.test(partes[j])){main+=partes[j];j++}
  const sec=partes.slice(j).filter(Boolean);
  const m=main.match(/^(bb|##|b|#|-)?(Cad|Ger|Fr|It|Sw|N|[ivIV]+)(o|ø|\+|%)?(.*)$/);
  if(!m) return null;
  return {acc:m[1]||'',num:m[2],cal:m[3]||'',dig:(m[4]||'').replace(/[^0-9]/g,''),sec};
}
const ROM={i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7};
function cifInterv(p){
  if(!p) return '?';
  if(p.num==='Cad') return '6/4';
  const T={'':'5','5':'5','53':'5','6':'6','63':'6','64':'6/4','7':'7','753':'7','65':'6/5','653':'6/5','43':'4/3','643':'4/3','42':'4/2','2':'4/2','642':'4/2','9':'9','97':'9/7'};
  return p.dig in T?T[p.dig]:p.dig.split('').join('/');
}
const esSeptima=p=>/^(7|65|43|42|2|753|653|643|642)$/.test(p.dig);
function inversion(p){
  if(/^(6|63|65|653)$/.test(p.dig)) return 1;
  if(/^(64|43|643)$/.test(p.dig)) return 2;
  if(/^(42|2|642)$/.test(p.dig)) return 3;
  return 0;
}
function funcGrado(acc,num,cal,menor){
  const g=ROM[num.toLowerCase()]; if(!g) return null;
  const may=num===num.toUpperCase(), dis=cal==='o'||cal==='ø';
  if(acc==='b'||acc==='-'){
    if(g===2) return 'sN';
    if(g===3) return 'tR'; if(g===6) return 'sR'; if(g===7) return 'dR';
    return null;
  }
  if(g===7&&dis) return 'Đ';
  if(g===2&&dis) return 's⁶';
  if(menor) return {1:may?'T':'t',2:'Sr',3:'tR',4:may?'S':'s',5:may?'D':'d',6:may?'sR':'Tr',7:may?'dR':'Đ'}[g];
  return {1:may?'T':'t',2:may?'DD':'Sr',3:may?'tR':'Dr',4:may?'S':'s',5:may?'D':'d',6:may?'sR':'Tr',7:may?'dR':'Đ'}[g];
}
function cifFunc(p,tono){
  if(!p) return '?';
  const menor=!!tono&&tono[0]===tono[0].toLowerCase();
  const inv=inversion(p), bajo=inv===1?'₃':inv===2?'₅':inv===3?'₇':'';
  if(p.num==='Cad') return 'D⁶₄';
  if(p.num==='N') return 'sN'+bajo;
  if(['It','Fr','Ger','Sw'].includes(p.num)) return 'DD⁷♭⁵';
  const base=funcGrado(p.acc,p.num,p.cal,menor);
  if(!base) return '—';
  let txt;
  if(base==='Đ') txt=p.cal==='o'&&esSeptima(p)?'Đ⁹♭':(p.cal==='ø'?'Đ⁹':'Đ⁷');
  else txt=base+(esSeptima(p)&&base!=='s⁶'?'⁷':'')+bajo;
  if(p.sec.length){
    const m=p.sec[0].match(/^(b|#|-)?([ivIV]+)/); if(!m) return txt;
    const destino=funcGrado(m[1]||'',m[2],'',menor)||'?';
    if(base[0]==='D'&&m[2]==='V'&&!m[1]) return 'D'+txt;        // V/V → DD
    return '('+txt+') '+destino;
  }
  return txt;
}
const RN_RE=/(^|[\s(→=])((?:bb|##|b|#)?(?:Cad|Ger|Fr|It|Sw|N|[ivIV]+)(?:o|ø|\+|%)?[0-9]*(?:\[[^\]]*\])*(?:\/[0-9]+)*(?:\/(?:b|#)?[ivIV]+)*)(?=$|[\s)→,·])(?: en ([A-Ga-g][#-]*))?/g;
function traducir(texto,tono,modo){
  return texto.replace(RN_RE,(all,pre,rn,k)=>{
    const p=parseRN(rn); if(!p) return all;
    return pre+(modo==='int'?cifInterv(p):cifFunc(p,k||tono))+(k?' en '+k:'');
  });
}
const ver=()=>({rom:$('#verRom').checked,int:$('#verInt').checked,fun:$('#verFun').checked});
function lineas(texto,tono){
  const v=ver(); let h='';
  if(v.rom) h+=`<span class="lin rom">${esc(texto)}</span>`;
  if(v.int) h+=`<span class="lin int" title="Cifrado interválico">${esc(traducir(texto,tono,'int'))}</span>`;
  if(v.fun) h+=`<span class="lin fun" title="Cifrado funcional">${esc(traducir(texto,tono,'fun'))}</span>`;
  return h||'<span class="lin" style="color:var(--muted)">(cifrados ocultos)</span>';
}

// ============ conceptos (detectores precalculados) ============
const GRUPOS={
 'Cadencias':['cadencia_autentica_perfecta','cadencia_autentica_imperfecta','cadencia_rota','semicadencia','cadencia_frigia','cadencia_plagal','sexta_cuarta_cadencial'],
 'Cadencias anotadas por el corpus':['cadencia_perfecta_anotada','cadencia_imperfecta_anotada','semicadencia_anotada','cadencia_rota_anotada','cadencia_plagal_anotada','cadencia_evitada_anotada'],
 'Acordes':['napolitana','napolitana_a_dominante','sexta_aumentada','sexta_aumentada_italiana','sexta_aumentada_francesa','sexta_aumentada_alemana','sexta_aumentada_a_64','acorde_disminuido','quinta_aumentada','sexta_anadida','intercambio_modal','acorde_vecino_cromatico'],
 'Dominantes secundarias':['dominante_secundaria','dominante_secundaria_resuelta','dominante_de_la_dominante','septima_disminuida_secundaria'],
 'Modulación':['modulacion','modulacion_diatonica','modulacion_cromatica','modulacion_enarmonica','modulacion_directa','modulacion_a_relativo','modulacion_a_dominante','modulacion_a_homonimo','modulacion_a_tercera'],
 'Secuencias y pedales':['secuencia_quintas','pedal_de_dominante'],
};
for(const k of Object.keys(META.conceptos)) if(!Object.values(GRUPOS).flat().includes(k)) GRUPOS['Acordes'].push(k);
const GRUPO_DE={}; for(const [g,l] of Object.entries(GRUPOS)) for(const k of l) GRUPO_DE[k]=g;
const ORDEN_C=Object.values(GRUPOS).flat();
const ACENTOS={modulacion:'modulación',diatonica:'diatónica',cromatica:'cromática',enarmonica:'enarmónica',cromatico:'cromático',homonimo:'homónimo',autentica:'auténtica',septima:'séptima'};
const NOMBRES={cadencia_perfecta_anotada:'cadencia perfecta (anotada)',cadencia_imperfecta_anotada:'cadencia imperfecta (anotada)',semicadencia_anotada:'semicadencia (anotada)',
 cadencia_rota_anotada:'cadencia rota (anotada)',cadencia_plagal_anotada:'cadencia plagal (anotada)',cadencia_evitada_anotada:'cadencia evitada (anotada)',
 cadencia_autentica_imperfecta:'cadencia auténtica imperfecta',acorde_disminuido:'acorde disminuido',quinta_aumentada:'acorde de quinta aumentada',sexta_anadida:'acorde de sexta añadida',
 secuencia_quintas:'secuencia de quintas descendentes'};
const NOMBRE=k=>NOMBRES[k]||k.split('_').map(w=>ACENTOS[w]||w).join(' ').replace('sexta aumentada a 64','sexta aumentada → 64 cadencial').replace('napolitana a dominante','napolitana → dominante').replace('sexta cuarta cadencial','sexta y cuarta cadencial');

function interpretar(texto){
  const t=norm(texto).trim(); if(!t) return null;
  if(META.conceptos[t]) return t;
  const directo=Object.keys(META.conceptos).find(k=>norm(NOMBRE(k))===t); if(directo) return directo;
  const puntos={};
  for(const [k,sins] of Object.entries(META.sinonimos)){
    const req=META.requiere[k];
    if(req && !req.every(g=>g.some(x=>t.includes(norm(x))))) continue;
    const enc=[...new Set(sins.map(norm))].filter(s=>t.includes(s));
    if(!enc.length) continue;
    const unicos=enc.filter(s=>!enc.some(o=>o!==s&&o.includes(s)));
    puntos[k]=unicos.reduce((a,s)=>a+s.length,0);
  }
  const ks=Object.keys(puntos); if(!ks.length) return null;
  return ks.reduce((a,b)=>puntos[b]>puntos[a]?b:a);
}
function puntuarConceptos(t){
  const palabras=t.split(' ').filter(Boolean), res=[];
  for(const k of Object.keys(META.conceptos)){
    const nom=norm(NOMBRE(k)), sins=(META.sinonimos[k]||[]).map(norm);
    const vocab=[nom,...sins].join(' ').split(' ');
    let p=0;
    if(nom.startsWith(t)) p+=500; else if(nom.includes(t)) p+=300;
    if(palabras.length&&palabras.every(w=>vocab.some(v=>v.startsWith(w)))) p+=200;
    if(sins.some(x=>x.startsWith(t))) p+=150;
    if(p) res.push([k,p]);
  }
  const el=t.length>4?interpretar(t):null;
  if(el){const r=res.find(x=>x[0]===el); if(r) r[1]+=100; else res.push([el,100])}
  return res.sort((a,b)=>b[1]-a[1]||ORDEN_C.indexOf(a[0])-ORDEN_C.indexOf(b[0])).map(x=>x[0]);
}

// ============ pasajes por tipo de acorde (condiciones combinables) ============
const FACETAS=[
 {id:'tri',g:'tipo',label:'solo tríadas',alias:['triadas','triada','solo triadas','tres sonidos'],desc:'solo acordes de tres sonidos',test:s=>s.cua===0&&s.otro===0&&s.tri>0},
 {id:'cua',g:'tipo',label:'con cuatríadas',alias:['cuatriadas','cuatriada','con cuatriadas','septimas','acordes de septima','con septimas','cuatro sonidos','triadas y cuatriadas'],desc:'tríadas y al menos un acorde de séptima',test:s=>s.cua>0&&s.otro===0},
 {id:'solocua',g:'tipo',label:'solo cuatríadas',alias:['solo cuatriadas','solo septimas'],desc:'todos los acordes con séptima',test:s=>s.tri===0&&s.otro===0&&s.cua>0},
 {id:'fund',g:'inv',label:'sin inversiones',alias:['sin inversion','estado fundamental','en estado fundamental','en fundamental','posicion fundamental'],desc:'todos en estado fundamental',test:s=>s.i1+s.i2+s.i3===0},
 {id:'inv',g:'inv',label:'con inversiones',alias:['invertidos','inversiones'],desc:'al menos un acorde invertido',test:s=>s.i1+s.i2+s.i3>0},
 {id:'inv1',g:'inv',label:'con primera inversión',alias:['primera inversion','1a inversion','con 1a inversion','hasta primera inversion'],desc:'1ª inversión, ninguna 2ª ni 3ª',test:s=>s.i1>0&&s.i2===0&&s.i3===0},
 {id:'inv2',g:'inv',label:'con segunda inversión',alias:['segunda inversion','2a inversion','con 2a inversion'],desc:'al menos un acorde de sexta y cuarta',test:s=>s.i2>0},
 {id:'inv3',g:'inv',label:'con tercera inversión',alias:['tercera inversion','3a inversion','con 3a inversion'],desc:'al menos una séptima con la 7ª en el bajo',test:s=>s.i3>0},
 {id:'nopres',g:'pres',label:'sin acordes prestados',alias:['sin prestados','sin prestamo','sin prestamo modal','sin intercambio modal'],desc:'ningún acorde del modo paralelo',test:s=>s.prest===0},
 {id:'pres',g:'pres',label:'con acordes prestados',alias:['con prestados','acordes prestados','prestados','con prestamo','con prestamo modal'],desc:'iv, ♭VI, ♭III, iiø… en mayor; picardía en menor',test:s=>s.prest>0},
 {id:'nosec',g:'sec',label:'sin dominantes secundarias',alias:['sin secundarias','sin dominante secundaria'],desc:'ninguna V/x ni viio/x',test:s=>s.sec===0},
 {id:'sec',g:'sec',label:'con dominantes secundarias',alias:['con secundarias','con dominante secundaria'],desc:'al menos una V/x o viio/x',test:s=>s.sec>0},
 {id:'diat',g:'crom',label:'solo acordes diatónicos',alias:['solo diatonicos','diatonicos','sin alteraciones','sin cromatismo','sin acordes alterados'],desc:'sin secundarias, prestados ni alterados',test:s=>s.alt===0&&s.sec===0&&s.prest===0},
 {id:'alt',g:'crom',label:'con acordes alterados',alias:['acordes alterados','alterados','con cromatismo'],desc:'napolitana, sextas aumentadas u otros',test:s=>s.alt>0},
 {id:'nomod',g:'mod',label:'sin modular',alias:['sin modulacion','sin modulaciones','una sola tonalidad'],desc:'una sola tonalidad',test:s=>!s.cambio},
 {id:'conmod',g:'mod',label:'con modulación',alias:['con modulaciones','modulando','con cambio de tonalidad'],desc:'cambia de tonalidad dentro del pasaje',test:s=>!!s.cambio},
];
const ORDEN_G=['tipo','inv','pres','sec','crom','modo','mod'];
const FAC=Object.fromEntries(FACETAS.map(f=>[f.id,f]));
const ALIAS=FACETAS.flatMap(f=>[norm(f.label),...f.alias.map(norm)].map(a=>({a,id:f.id}))).sort((x,y)=>y.a.length-x.a.length);
const RELLENO=new Set(['acordes','acorde','pasajes','pasaje','fragmentos','con','y','e','de','solo','que','sin','en']);

function parsearFacetas(t){
  const usados=new Array(t.length).fill(false), hallados=[];
  for(const {a,id} of ALIAS){
    let i=t.indexOf(a);
    while(i>=0){
      const fin=i+a.length, bI=i===0||t[i-1]===' ', bF=fin===t.length||t[fin]===' ';
      if(bI&&bF&&!usados.slice(i,fin).some(Boolean)){usados.fill(true,i,fin);hallados.push({i,fin,id})}
      i=t.indexOf(a,i+1);
    }
  }
  hallados.sort((x,y)=>x.i-y.i);
  const porGrupo={}; for(const h of hallados) porGrupo[FAC[h.id].g]=h.id;
  const ids=ORDEN_G.map(g=>porGrupo[g]).filter(Boolean);
  const finUlt=hallados.length?hallados[hallados.length-1].fin:0;
  const libres=t.split('').map((c,i)=>usados[i]?' ':c).join('').split(' ').filter(w=>w&&!RELLENO.has(w));
  const cola=t.slice(finUlt).trim();
  const colaPal=new Set(cola.split(' '));
  const medioLibre=libres.some(w=>!colaPal.has(w));
  return {ids,cola,libres,medioLibre};
}
function etiquetaFacetas(ids){
  const fs=ORDEN_G.map(g=>ids.find(id=>FAC[id].g===g)).filter(Boolean).map(id=>FAC[id]);
  if(!fs.length) return '';
  return 'pasajes '+fs.map(f=>f.label).join(', ');
}

let COMP=null, compCargando=null;
function cargarCompases(){
  if(!compCargando) compCargando=fetch('data/compases.json').then(r=>r.json()).then(d=>(COMP=d));
  return compCargando;
}
function pasajes(ids,f,contar){
  const tests=ids.map(id=>FAC[id].test), L=f.L, out=[]; let total=0;
  for(const [idS,filas] of Object.entries(COMP.obras)){
    const id=+idS;
    if(!pasaObra(porId.get(id),f)) continue;
    let n=0, i=0;

function anotar(svg,acordes,compasDom,primero,reducir){

  const ini=medidas.map(m=>inicio.get(m.id)), dur=ini.map(s0=>{const n=arranques.find(q=>q>s0+1e-6);return n!=null?n-s0:mt.full});

    if(!e.on) continue;
    for(const id of e.on){
      const el=document.getElementById(id); if(!el||!svg.contains(el)) continue;
      const m=el.closest('g.measure'); if(!m||!idx.has(m.id)) continue;
      const i=idx.get(m.id); if(ini[i]==null) continue;
      const nh=el.querySelector('.notehead')||el; let bb; try{bb=nh.getBBox()}catch(_){continue}

      xs.push(bb.x+bb.width/2); ataques[i].set(q,xs);
    }
  }
  const xDe=(i,q)=>{
    const lista=[...ataques[i].entries()].map(([qq,xs])=>({q:qq,x:xs.reduce((s1,x)=>s1+x,0)/xs.length})).sort((p,r)=>p.q-r.q);

    let q=(c.parte-1)*mt.beat;
    if(c.compas===primero&&segs.length===1&&dur[segs[0]]<mt.full-1e-6) q-=mt.full-dur[segs[0]];
    q=Math.max(0,q);
    let k=0; while(k<segs.length-1&&q>=(dur[segs[k]]||mt.full)-1e-6){q-=dur[segs[k]]||mt.full;k++}
    puestos.push({c,x:xDe(segs[k],q),p:parseRN(c.rn)});
  }
  const sistema=svg.querySelector('g.system').getBBox(), abajo=sistema.y+sistema.height;
  const g=document.createElementNS(NS,'g'); g.setAttribute('class','cifrados'); pm.append(g);
  const etiquetaTono=t=>{const e=tonoEs(t);return (t[0]===t[0].toUpperCase()?e[0].toUpperCase()+e.slice(1):e)+':'};
  function dibujar(f){
    g.innerHTML='';
    const hayCambios=puestos.some((z,i)=>i>0&&z.c.tono!==puestos[i-1].c.tono);

      if(filas.rom!=null){
        const gg=document.createElementNS(NS,'g'); g.append(gg);

      }
      if(filas.int!=null&&p) cifInterv(p).split('/').forEach((n,k)=>{const t=texto(g,n,x,filas.int+k*f*0.8,f*0.74,{'text-anchor':'middle'});w=Math.max(w,ancho(t))});
      if(filas.fun!=null){
        const t=texto(g,cifFunc(p,c.tono),x,filas.fun,f*0.95,{'text-anchor':'middle'}); w=Math.max(w,ancho(t));
      }

        else texto(g,etiquetaTono(c.tono),x-w/2,filaT-f*1.05,f*0.72,{'font-style':'italic'});

  const tr=(pm.getAttribute('transform')||'').match(/translate\(\s*(-?[\d.]+)[ ,]+(-?[\d.]+)/)||[0,0,0];

  return r;
}

    const doc={coleccion:$('#gCol').value.trim(),comentario:$('#gCom').value.trim(),etiquetas:$('#gEtq').value.split(',').map(x=>x.trim()).filter(Boolean),
      valoracion:+$('#gVal').dataset.v||null,observaciones:$('#gObs').value.trim(),analisis:o.src.clave,obra:o.ob,compositor:o.c,movimiento:movDe(o),
      compas:h.compas||h.ini,parte:h.parte||null,ini:h.ini||h.compas,fin:h.fin||h.compas,tono:h.tono||'',frag:!!h.frag,procedimiento:d.nombre,etiqueta:h.etq||'',creado:Date.now()};
    try{await DB.collection('data/users/'+UID).add(doc);aviso('Guardado en «'+doc.coleccion+'»')}catch(err){aviso('No se pudo guardar')}
  };
}
function pintarColecciones(){
  const caja=$('#colecciones');
  if(!guardados.length){caja.innerHTML='<h2>Colecciones</h2><p style="color:var(--muted)">Aún no has guardado ejemplos. Abre uno y pulsa «Guardar en una colección».</p>';return}
  const por=new Map(); for(const g of guardados.sort((a,b)=>b.creado-a.creado)){const k=g.coleccion||'Sin colección';if(!por.has(k))por.set(k,[]);por.get(k).push(g)}
  caja.innerHTML='<h2>Colecciones</h2>'+[...por].map(([c,l])=>`<details open><summary><b>${esc(c)}</b> <span style="color:var(--muted)">${l.length}</span></summary>${l.map(g=>`
    <div class="col-item"><div><b>${esc(g.obra)}</b>${g.movimiento&&g.movimiento!=='—'?' · '+esc(g.movimiento):''} <span style="color:var(--muted)">${esc(g.compositor)} · ${g.frag?`cc. ${g.ini}–${g.fin}`:`c. ${g.compas}`}</span></div>
      <div style="color:var(--muted);font-size:13px">${esc(g.procedimiento||'')}${g.valoracion?' · '+'★'.repeat(g.valoracion):''}${g.etiquetas&&g.etiquetas.length?' · '+g.etiquetas.map(esc).join(', '):''}</div>
      ${g.comentario?`<div>${esc(g.comentario)}</div>`:''}${g.observaciones?`<div style="font-size:13px"><i>${esc(g.observaciones)}</i></div>`:''}
      <div class="acc"><button class="btn" type="button" data-abrir="${esc(g.id)}">Abrir</button><button class="btn" type="button" data-borrar="${esc(g.id)}">Eliminar</button></div></div>`).join('')}</details>`).join('');
  caja.querySelectorAll('[data-abrir]').forEach(b=>b.onclick=()=>{
    const g=guardados.find(x=>x.id===b.dataset.abrir), o=g&&porClave.get(g.analisis);
    if(!o){aviso('Ese análisis ya no está en el corpus');return}
    mostrar(g.frag?{frag:true,obra:o.id,ini:g.ini,fin:g.fin,tono:g.tono}:{obra:o.id,compas:g.compas,parte:g.parte,ini:g.ini,fin:g.fin,tono:g.tono,etq:g.etiqueta});
  });
  caja.querySelectorAll('[data-borrar]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.seguro!=='1'){b.dataset.seguro='1';b.textContent='¿Eliminar? Pulsa otra vez';return}
    try{await DB.collection('data/users/'+UID).doc(b.dataset.borrar).delete()}catch(e){aviso('No se pudo eliminar')}
  });
}
$('#verColecciones').onclick=()=>{const c=$('#colecciones');c.hidden=!c.hidden;if(!c.hidden)pintarColecciones()};
function moverVista(d){
  if(!seleccion||!seleccion.frag) return;
  const L=seleccion.fin-seleccion.ini+1, h={...seleccion};
  h.ini+=d*L; h.fin+=d*L;
  if(h.obraEntera){if(h.ini<h.primero){h.ini=h.primero;h.fin=h.primero+L-1} if(h.fin>h.ultimo){h.fin=h.ultimo;h.ini=Math.max(h.primero,h.ultimo-L+1)}}
  else if(h.ini<0){h.ini=0;h.fin=L-1}
  h.s=null; mostrar(h);
}
$('#atras').onclick=()=>moverVista(-1); $('#adelante').onclick=()=>moverVista(1);
function aviso(t){const el=$('#toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1600)}

// ============ estado inicial: vacío ============
pintarInicio(); pintarEtiquetas();

  get opciones(){return opciones},get filas(){return filas},fijarSeleccion:h=>{seleccion=h}};
})();
