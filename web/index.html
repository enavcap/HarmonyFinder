<title>Harmony Finder</title>
<link rel="icon" type="image/svg+xml" href="icono.svg">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
@font-face{font-family:'Academico';src:url(fonts/academico.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Academico';src:url(fonts/academico-bold.woff2) format('woff2');font-weight:700}
/* Layout: una columna de trabajo (consulta → resultados) y un panel de partitura
   que se pega debajo en móvil y a la derecha en pantallas anchas. */
:root{
  --bg:#f7f6f2; --panel:#ffffff; --fg:#1d2126; --muted:#5d6670; --line:#dcd9d1;
  --accent:#1f5f6b; --accent-ink:#ffffff; --accent-soft:#e3eeef; --hl:#fff2c2; --enh:#8a3b7a; --dir:#9a5a12;
  --int:#6b4fa0; --fun:#2f6b3a;
  --display:"Literata",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181b; --panel:#1d2126; --fg:#e8e6e0; --muted:#9aa3ab; --line:#2f353b;
  --accent:#6fb7c2; --accent-ink:#0f1a1c; --accent-soft:#1c2f33; --hl:#4a3f12; --enh:#d99ac9; --dir:#e0a85a;
  --int:#b9a4e6; --fun:#8fd19c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181b; --panel:#1d2126; --fg:#e8e6e0; --muted:#9aa3ab; --line:#2f353b;
  --accent:#6fb7c2; --accent-ink:#0f1a1c; --accent-soft:#1c2f33; --hl:#4a3f12; --enh:#d99ac9; --dir:#e0a85a;
  --int:#b9a4e6; --fun:#8fd19c; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
header{max-width:1240px;margin:0 auto;padding-block:28px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font:600 26px/1.1 var(--display);margin:0;text-wrap:balance}
h1{display:flex;align-items:center;gap:10px}
h1 .logo{width:34px;height:34px;flex:none;color:var(--accent)}
header p{margin:0;color:var(--muted);font-size:14px}
header p b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
main{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
main:has(#vista[hidden]),body:has(#vista[hidden]) header,body:has(#vista[hidden]) footer,body:has(#vista[hidden]) #colecciones{max-width:760px}
@media (min-width:980px){main:not(:has(#vista[hidden])){grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  #vista{position:sticky;top:12px}}

select{font:14px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);max-width:100%}
select:focus,button:focus-visible,.fila:focus-visible,input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);padding:4px 2px;cursor:pointer}
label.chk input{accent-color:var(--accent)}

.buscador{position:relative}
.caja{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:text;min-height:52px}
.caja:focus-within{outline:2px solid var(--accent);outline-offset:1px}
#chips{display:contents}
.caja input[type=search]{flex:1 1 180px;min-width:120px;font:17px var(--body);padding:6px 4px;border:0;background:transparent;color:var(--fg);outline:none}
.caja input[type=search]::-webkit-search-cancel-button{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;font:14px/1.2 var(--body);padding:5px 4px 5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--fg);border:1px solid transparent}
.chip.principal{background:var(--accent);color:var(--accent-ink)}
.chip .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .tp{font-size:11px;opacity:.75;margin-right:2px}
.chip button{border:0;background:none;color:inherit;font-size:16px;line-height:1;cursor:pointer;padding:0 6px;border-radius:999px;opacity:.75}
.chip button:hover{opacity:1}
.limpiar{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px;margin-left:auto}
.ajustes{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-top:8px;font-size:14px;color:var(--muted)}
.ajustes select{padding:5px 8px;font-size:13.5px}
.ajustes .num{width:64px;font:14px var(--body);padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.limite{margin:-4px 0 8px}
#inicio{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;position:relative}
#inicio:empty{display:none}
#inicio details{position:static}
#inicio summary{list-style:none;font:14px var(--body);padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--fg);cursor:pointer;user-select:none;white-space:nowrap}
#inicio summary::-webkit-details-marker{display:none}
#inicio summary::after{content:" ▾";color:var(--muted);font-size:12px}
#inicio summary:hover,#inicio details[open] summary{border-color:var(--accent);color:var(--accent)}
#inicio .menu{position:absolute;z-index:15;top:calc(100% + 6px);left:0;width:min(340px,100%);padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);display:grid;gap:2px}
#inicio .menu.ancho{width:min(560px,100%)}
#inicio .menu button{font:14px var(--body);text-align:left;padding:7px 10px;border:0;border-radius:6px;background:none;color:var(--fg);cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
#inicio .menu button:hover,#inicio .menu button:focus-visible{background:var(--accent-soft);outline:none}
#inicio .menu button:disabled{opacity:.3;cursor:default;background:none}
#inicio .tabs button.apagada{opacity:.4}
#inicio .menu button.mono{font-family:var(--mono);font-size:13.5px}
#inicio .menu .c,#inicio .menu .r{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#inicio .tabs{display:flex;flex-wrap:wrap;gap:4px;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
#inicio .tabs button{font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:999px}
#inicio .tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#inicio .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px}
#inicio .filtro{font:14px var(--body);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);margin-bottom:4px}
#inicio .lista{max-height:min(320px,50vh);overflow-y:auto;display:grid;gap:2px}
#inicio .sec{display:grid;gap:1px}
#inicio .forma{grid-template-columns:1fr 1fr;gap:8px}
#inicio .forma h3{font:500 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 10px 4px}
#inicio .forma .items{grid-template-columns:1fr}
@media (max-width:520px){#inicio .forma{grid-template-columns:1fr}}
#inicio .sec h3{font:500 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 10px 4px}
#inicio .tono{grid-template-columns:1fr auto auto;gap:8px;align-items:start}
#inicio .tono .col{display:grid;gap:2px}
#inicio .tono .notas{grid-template-columns:repeat(4,1fr)}
#inicio .tono .col button{justify-content:center;border:1px solid var(--line)}
#inicio .tono .alts button{font-size:17px;min-width:40px}
#inicio .tono button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#inicio .tono .modos button{border-color:var(--accent);color:var(--accent);min-width:76px}
#inicio .pista{font-size:12.5px;color:var(--muted);margin:4px 10px 2px;grid-column:1/-1}
#sugerencias .tipo-s{grid-row:1;grid-column:2;align-self:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
#sugerencias{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:min(460px,62vh);overflow-y:auto}
#sugerencias li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;padding:7px 10px;border-radius:6px;cursor:pointer}
#sugerencias li[aria-selected=true]{background:var(--accent-soft)}
#sugerencias .n{font-size:15px;color:var(--fg)}
#sugerencias .n mark{background:none;color:var(--accent);font-weight:600}
#sugerencias .d{grid-column:1;font-size:12.5px;color:var(--muted)}
#sugerencias .c{grid-row:1;grid-column:2;align-self:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
#sugerencias .g{font:500 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px;cursor:default;display:block}
#sugerencias .vacia{color:var(--muted);font-size:14px;cursor:default;display:block}

.opciones{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;margin-top:10px;font-size:14px}
details.filtros summary{cursor:pointer;color:var(--muted);width:max-content;max-width:100%}
details.filtros summary b{color:var(--accent);font-weight:500}
details.filtros[open]{flex-basis:100%}
details.filtros .cuerpo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.mostrar{display:flex;flex-wrap:wrap;align-items:center;gap:0 12px;color:var(--muted)}
.mostrar .et{font-size:13px}
.mostrar .rom{color:var(--fg)} .mostrar .int{color:var(--int)} .mostrar .fun{color:var(--fun)}

.estado:empty{display:none}
.quizas{margin:-2px 0 10px;font-size:14px;color:var(--muted)}
.quizas button{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.quizas button strong{font-weight:600}
.quizas .pista-caja{display:block;font-size:12.5px;margin-top:2px}
.estado{margin:14px 0 8px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.estado strong{color:var(--fg);font-weight:500}
.estado code{font:13px var(--mono);background:var(--accent-soft);color:var(--fg);padding:1px 6px;border-radius:4px}
.leyenda{font-size:12.5px;color:var(--muted);margin:-2px 0 8px}
.leyenda b{color:var(--fun);font-weight:500}

.tabla{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.tabla .wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font:500 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td.cif{min-width:150px}
td.obra{max-width:300px}
td.obra .t{display:block}
td.obra .c{display:block;color:var(--muted);font-size:13px}
.lin{display:block;white-space:normal}
.lin.rom{font:13.5px var(--mono);color:var(--fg)}
.lin.int{font:12.5px var(--mono);color:var(--int)}
.lin.fun{font:13.5px var(--body);color:var(--fun)}
.lin .sep{color:var(--muted);opacity:.6;padding:0 2px}
.lin .uni{opacity:.4}
/* cifra tachada (intervalo disminuido): barra oblicua sobre la cifra */
.tch{position:relative;display:inline-block}
.tch::after{content:'';position:absolute;left:-.12em;right:-.12em;top:50%;border-top:.09em solid currentColor;transform:rotate(-55deg)}
.resumen{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.fila{cursor:pointer}
.fila:hover td{background:var(--accent-soft)}
.fila[aria-selected=true] td{background:var(--hl)}
.pag{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
button.btn{font:14px var(--body);padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.btn:disabled{opacity:.45;cursor:default}

.tipo{display:inline-block;font:500 11px/1.6 var(--body);letter-spacing:.04em;text-transform:uppercase;padding:0 7px;border-radius:999px;margin:2px 0;vertical-align:1px;border:1px solid currentColor}
.t-dia{color:var(--muted)} .t-cro{color:var(--accent)} .t-enh{color:var(--enh)} .t-dir{color:var(--dir)} .t-cad{color:var(--accent)} .t-nocad{color:var(--muted)}
.det{display:block;font:12.5px var(--body);color:var(--muted);white-space:normal;margin-top:2px}

#vista{border:1px solid var(--line);border-radius:8px;background:var(--panel);min-height:260px;display:flex;flex-direction:column;min-width:0}
#vista .cab{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#vista .cab h3{font:600 18px/1.25 var(--display);margin:0;text-wrap:balance}
#vista .cab .sub{color:var(--muted);font-size:14px}
#vista .herr{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
#vista .herr input[type=range]{width:110px;accent-color:var(--accent)}
#vista .herr a{color:var(--accent)}
#partitura{padding:10px 12px 14px;overflow-x:auto;background:#fff;color:#000}
#partitura svg{max-width:100%;height:auto;display:block}
#partitura.desliza{position:relative}
#partitura.desliza::before{content:attr(data-desliza);position:sticky;left:0;display:block;font:12px var(--body);color:#5d6670;margin:0 0 4px}
#partitura .vacio{font-family:var(--body);color:#5d6670;padding:40px 16px;text-align:center;font-size:14px}
:root[data-theme="dark"] #partitura{background:#f3f1ec}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #partitura{background:#f3f1ec}}
#tira{border-top:1px solid var(--line);overflow-x:auto;border-radius:0 0 8px 8px}
#tira table{min-width:0;width:auto}
#tira th,#tira td{padding:5px 9px;border-bottom:0;white-space:nowrap;text-align:center}
#tira th{font:500 11px var(--body);letter-spacing:.02em;text-transform:none;color:var(--muted);border-bottom:1px solid var(--line)}
#tira .nc{border-left:1px solid var(--line)}
#tira td.rot{font:500 10.5px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;position:sticky;left:0;background:var(--panel)}
#tira tr.rom td{font:14px var(--mono)} #tira tr.int td{font:13px var(--mono);color:var(--int)} #tira tr.fun td{font:14px var(--body);color:var(--fun)}
#tira td.foco{background:var(--hl)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.grupo td{background:var(--panel);border-bottom:1px solid var(--line);cursor:pointer;padding-left:26px}
tr.comp td{cursor:pointer;background:var(--bg);font-size:14.5px}
tr.comp .gt{font-weight:600}
tr.comp:hover td,.grupo:hover td{background:var(--accent-soft)}
.fl{display:inline-block;width:12px;color:var(--muted)}
.resumen-b{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 14px;margin-bottom:12px;display:grid;gap:6px}
.resumen-b .tit{margin:0 0 2px;font-size:14px;color:var(--muted)}
.resumen-b .tit strong{color:var(--fg);font-weight:600}
.fila-b{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:baseline}
.fila-b .et{font:500 10.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fila-b>div{display:flex;flex-wrap:wrap;gap:2px 4px}
.fila-b button{display:inline-flex;align-items:center;gap:6px;font:13.5px var(--body);padding:3px 8px;border:0;border-radius:6px;background:none;color:var(--fg);cursor:pointer}
.fila-b button:hover{background:var(--accent-soft)}
.fila-b .b{display:inline-block;height:8px;border-radius:2px;background:var(--accent);opacity:.75}
.fila-b .c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fila-b .mas-b{color:var(--accent)}
@media (max-width:560px){.fila-b{grid-template-columns:1fr}}
#destacados{margin-bottom:12px}
#destacados .et{font:500 10.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
#destacados .tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
#estado:has(~ #resumen:not([hidden])){display:none}
@media (max-width:600px){.tabla table{min-width:0} td.cif{min-width:0} td.cif .lin{white-space:normal;overflow-wrap:anywhere} th:nth-child(3),td.num+td.num{display:none}
  th,td{padding-left:6px;padding-right:6px} th{white-space:normal} td.obra{max-width:38vw}
  tr.comp td,.grupo td{white-space:normal}}
#destacados button{display:grid;gap:2px;text-align:left;font:13px var(--body);padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);cursor:pointer;min-width:0}
#destacados button:hover{border-color:var(--accent)}
#destacados button[aria-pressed=true]{background:var(--hl);border-color:var(--accent)}
#destacados .cp{font-weight:600;font-size:14px}
#destacados .ob{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#destacados .dn{font-size:12.5px}
#destacados code{font:12.5px var(--mono)}
.grupo .gt{font-weight:500}
.grupo .gs{color:var(--muted);font-size:13px}
tr.hijo td:first-child{padding-left:44px}
tr.mas td{color:var(--accent);font-size:13px;cursor:pointer;padding-top:4px;padding-bottom:6px}
.fu{display:inline-block;font:500 10.5px/1.6 var(--body);letter-spacing:.04em;padding:0 6px;border-radius:4px;margin-right:4px;vertical-align:1px;border:1px solid var(--line);color:var(--muted)}
.fu.wir{color:var(--accent);border-color:currentColor}
.n-an{font:11px var(--body);color:var(--muted);white-space:nowrap}
.fu.dcml{color:var(--enh);border-color:currentColor}
.fu.anot{color:var(--fun);border-color:currentColor}
#selAnalisis{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);align-items:center}
#selAnalisis button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#selAnalisis button[aria-pressed=true] .fu{color:var(--accent-ink);border-color:currentColor}
#ficha{border-top:1px solid var(--line);font-size:13.5px}
#ficha summary{padding:10px 16px;cursor:pointer;color:var(--muted)}
#ficha .cuerpo{padding:0 16px 14px;display:grid;gap:10px}
#ficha dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;margin:0}
#ficha dt{color:var(--muted)} #ficha dd{margin:0;overflow-wrap:anywhere}
#ficha details.tecnico summary{padding:2px 0;font-size:12.5px}
#ficha details.tecnico dl{margin-top:6px}
#ficha a{color:var(--accent)}
.ctx{font:13.5px var(--mono);line-height:1.9;overflow-wrap:anywhere}
.ctx .f{background:var(--hl);padding:1px 4px;border-radius:3px}
.ctx .k{color:var(--muted);font-family:var(--body);font-style:italic;font-size:12.5px}
#comparar{border-top:1px solid var(--line);overflow-x:auto}
#comparar table{min-width:0}
#comparar td,#comparar th{font-size:13px;padding:5px 10px}

(async function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[,;.:]/g,' ').replace(/\s+/g,' ');
const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
// ============ idioma: la interfaz cambia; las búsquedas trabajan con claves y dan los mismos resultados
const LANG=(()=>{const p=pref('idioma');if(p==='es'||p==='en')return p;return /^en\b/i.test(navigator.language||'')?'en':'es'})();
const EN=LANG==='en', LOC=LANG, trd=(es,en)=>EN?en:es;
document.documentElement.lang=LANG;
function aplicarIdioma(raiz=document){
  if(!EN) return;
  raiz.querySelectorAll('[data-en]').forEach(el=>{el.textContent=el.dataset.en});
  for(const at of ['placeholder','aria-label','title']) raiz.querySelectorAll(`[data-en-${at}]`).forEach(el=>el.setAttribute(at,el.getAttribute(`data-en-${at}`)));
}
aplicarIdioma();
const META=await (await fetch('data/meta.json')).json();
const VOC=await (await fetch('data/vocab.json')).json();
const FORMA=await fetch('data/forma.json').then(r=>r.ok?r.json():{}).catch(()=>({}));
// forma global de cada movimiento ([forma, fuente]) y número tradicional de sonatas y cuartetos
const FORMAS=await fetch('data/formas.json').then(r=>r.ok?r.json():{}).catch(()=>({}));
const NUMEROS=await fetch('data/numeros.json').then(r=>r.ok?r.json():{}).catch(()=>({}));
const OBRAS=await (await fetch('data/obras.json')).json();
// número tradicional en el título: «Sonata para piano n.º 8, K. 310»
for(const o of OBRAS){const n=NUMEROS[o.w]; if(!n) continue;
  for(const k of ['t','ob']) o[k]=o[k].replace(/^(Sonata para piano|Cuarteto de cuerda), /,(a,p)=>`${p} n.º ${n}, `)}
// títulos que genera el catálogo en español
const TITULOS_EN=[[/^Sonata para piano n\.º (\d+)/,'Piano Sonata No. $1'],[/^Cuarteto de cuerda n\.º (\d+)/,'String Quartet No. $1'],[/^Sonata para piano/,'Piano Sonata'],[/^Cuarteto de cuerda/,'String Quartet'],[/^Madrigali, libro/,'Madrigals, book'],[/^El clave bien temperado, libro/,'The Well-Tempered Clavier, Book'],[/\. Preludio$/,'. Prelude']];
// compositores con transliteración española: en inglés, la inglesa (el buscador acepta las dos)
const COMP_EN={'Piotr Ilich Chaikovski':'Pyotr Ilyich Tchaikovsky','Serguéi Rajmáninov':'Sergei Rachmaninoff','Nikolái Rimski-Kórsakov':'Nikolai Rimsky-Korsakov'};
const COMP_OTRO=Object.fromEntries(Object.entries(COMP_EN).flatMap(([a,b])=>[[a,b],[b,a]]));
// datos de procedencia que escribe el catálogo en español
const DATOS_EN=[[/versión «/g,'version «'],[/^reconstruida desde las tablas de notas del DCML$/,'reconstructed from the DCML note tables'],
  [/^corpus de music21$/,'music21 corpus'],[/^convertida desde Humdrum \(Craig Sapp\)$/,'converted from Humdrum (Craig Sapp)']];
// se marca antes de traducir: el arreglo de voces de las partituras reconstruidas no debe depender del idioma
for(const o of OBRAS) o.reconstruida=/^reconstruida/.test(o.src.partitura||'');
for(const o of OBRAS) o.convertida=/^convertida/.test(o.src.partitura||'');   // edición Humdrum → MusicXML: las alteraciones salen en cada nota, no son las impresas
if(EN) for(const o of OBRAS){for(const [re,en] of TITULOS_EN){o.t=o.t.replace(re,en);o.ob=o.ob.replace(re,en)} if(COMP_EN[o.c]) o.c=COMP_EN[o.c]
  for(const k of ['autores','partitura','origen']) if(o.src[k]) for(const [re,en] of DATOS_EN) o.src[k]=o.src[k].replace(re,en)}
const porId=new Map(OBRAS.map(o=>[o.id,o]));
const porMov=new Map(); for(const o of OBRAS){if(!porMov.has(o.m))porMov.set(o.m,[]);porMov.get(o.m).push(o)}
const porClave=new Map(OBRAS.map(o=>[o.src.clave,o]));
const NFUENTE={wir:'When in Rome',dcml:'DCML'};
const badge=f=>`<span class="fu ${f}">${f==='wir'?'WiR':'DCML'}</span>`;

// ============ filtros ============

// ============ cifrados: romano → interválico y funcional ============
function parseRN(fig){
  const f=String(fig).replace(/\[[^\]]*\]/g,'');
  const partes=f.split('/'); let main=partes[0], j=1;
  while(j<partes.length&&/^\d/.test(partes[j])){main+=partes[j];j++}
  const sec=partes.slice(j).filter(Boolean);
  const m=main.match(/^(bb|##|b|#|-)?(Cad|Ger|Fr|It|Sw|N|[ivIV]+)(o|ø|\+|%)?(.*)$/);
  if(!m) return null;
  return {acc:m[1]||'',num:m[2],cal:m[3]||'',dig:(m[4]||'').replace(/[^0-9]/g,''),sec};
}
const ROM={i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7};
function cifInterv(p){
  if(!p) return '?';
  if(p.num==='Cad') return '6/4';
  const T={'':'5','5':'5','53':'5','6':'6','63':'6','64':'6/4','7':'7','753':'7','65':'6/5','653':'6/5','43':'4/3','643':'4/3','42':'4/2','2':'4/2','642':'4/2','9':'9','97':'9/7'};
  return p.dig in T?T[p.dig]:p.dig.split('').join('/');
}
// cifrado interválico para leer (web/cifrado.js: sensible «+», disminuidos tachados, alteraciones); el de arriba,
// cifInterv(), es solo la clave interna de las búsquedas de progresiones y no cambia
const cifFilas=(rn,tono)=>{try{const f=Cifrado.cifras(rn,tono,{en:EN});if(f&&f.length)return f}catch(e){}const p=parseRN(rn);return p?cifInterv(p).split('/'):['?']};
const cifInt=(rn,tono)=>{const f=cifFilas(rn,tono);return Cifrado.texto(f)||f.join('/')};
// a HTML: la cifra con U+0338 detrás se dibuja tachada
const htmlInt=t=>esc(t).replace(/(\d)\u0338/g,'<span class="tch">$1</span>');
const esSeptima=p=>/^(7|65|43|42|2|753|653|643|642)$/.test(p.dig);
function inversion(p){
  if(/^(6|63|65|653)$/.test(p.dig)) return 1;
  if(/^(64|43|643)$/.test(p.dig)) return 2;
  if(/^(42|2|642)$/.test(p.dig)) return 3;
  return 0;
}
function funcGrado(acc,num,cal,menor){
  const g=ROM[num.toLowerCase()]; if(!g) return null;
  const may=num===num.toUpperCase(), dis=cal==='o'||cal==='ø';
  if(acc==='b'||acc==='-'){
    if(g===2) return 'sN';
    if(g===3) return 'tR'; if(g===6) return 'sR'; if(g===7) return 'dR';
    return null;
  }
  if(g===7&&dis) return 'Đ';
  if(g===2&&dis) return 's⁶';
  if(menor) return {1:may?'T':'t',2:'Sr',3:'tR',4:may?'S':'s',5:may?'D':'d',6:may?'sR':'Tr',7:may?'dR':'Đ'}[g];
  return {1:may?'T':'t',2:may?'DD':'Sr',3:may?'tR':'Dr',4:may?'S':'s',5:may?'D':'d',6:may?'sR':'Tr',7:may?'dR':'Đ'}[g];
}
function cifFunc(p,tono){
  if(!p) return '?';
  const menor=!!tono&&tono[0]===tono[0].toLowerCase();
  const inv=inversion(p), bajo=inv===1?'₃':inv===2?'₅':inv===3?'₇':'';
  if(p.num==='Cad') return 'D⁶₄';
  if(p.num==='N') return 'sN'+bajo;
  if(['It','Fr','Ger','Sw'].includes(p.num)) return 'DD⁷♭⁵';
  const base=funcGrado(p.acc,p.num,p.cal,menor);
  if(!base) return '—';
  let txt;
  if(base==='Đ') txt=p.cal==='o'&&esSeptima(p)?'Đ⁹♭':(p.cal==='ø'?'Đ⁹':'Đ⁷');
  else txt=base+(esSeptima(p)&&base!=='s⁶'?'⁷':'')+bajo;
  if(p.sec.length){
    const m=p.sec[0].match(/^(b|#|-)?([ivIV]+)/); if(!m) return txt;
    const destino=funcGrado(m[1]||'',m[2],'',menor)||'?';
    if(base[0]==='D'&&m[2]==='V'&&!m[1]) return 'D'+txt;        // V/V → DD
    return '('+txt+') '+destino;
  }
  return txt;
}
const RN_RE=/(^|[\s(→=])((?:bb|##|b|#)?(?:Cad|Ger|Fr|It|Sw|N|[ivIV]+)(?:o|ø|\+|%)?[0-9]*(?:\[[^\]]*\])*(?:\/[0-9]+)*(?:\/(?:b|#)?[ivIV]+)*)(?=$|[\s)→,·])(?: en ([A-Ga-g][#-]*))?/g;
function traducir(texto,tono,modo){

function interpretar(texto){
  const t=norm(texto).trim(); if(!t) return null;
  if(META.conceptos[t]) return t;
  const directo=Object.keys(META.conceptos).find(k=>norm(NOMBRE(k))===t); if(directo) return directo;
  const puntos={};
  for(const [k,sins] of Object.entries(META.sinonimos)){
    const req=META.requiere[k];
    if(req && !req.every(g=>g.some(x=>t.includes(norm(x))))) continue;
    const enc=[...new Set(sins.map(norm))].filter(s=>s.length>3||!/^[a-z0-9]+$/.test(s)?t.includes(s):new RegExp('(^| )'+s.replace(/[.*+?^${}()|[\]\\/]/g,'\\$&')+'( |$)').test(t));
    if(!enc.length) continue;
    const unicos=enc.filter(s=>!enc.some(o=>o!==s&&o.includes(s)));
    puntos[k]=unicos.reduce((a,s)=>a+s.length,0);
  }
  const ks=Object.keys(puntos); if(!ks.length) return null;
  return ks.reduce((a,b)=>puntos[b]>puntos[a]?b:a);
}
function puntuarConceptos(t){
  const palabras=t.split(' ').filter(Boolean), res=[];
  for(const k of Object.keys(META.conceptos)){
    const nom=norm(NOMBRE(k)), sins=(META.sinonimos[k]||[]).map(norm);
    const vocab=[nom,...sins].join(' ').split(' ');
    let p=0;
    if(nom.startsWith(t)) p+=500; else if(nom.includes(t)) p+=300;
    if(palabras.length&&palabras.every(w=>vocab.some(v=>v.startsWith(w)))) p+=200;
    if(sins.some(x=>x.startsWith(t))) p+=150;
    const otro=norm((VOC.conceptos[k]||{})[EN?'es':'en']||''); if(otro.startsWith(t)) p+=400; else if(t.length>2&&otro.includes(t)) p+=250;
    if(p) res.push([k,p]);
  }
  const el=t.length>4?interpretar(t):null;
  if(el){const r=res.find(x=>x[0]===el); if(r) r[1]+=100; else res.push([el,100])}
  for(const r of res){
    const k=r[0], req=META.requiere[k];
    // una subclase («sexta napolitana → dominante») solo pasa delante si se escribe lo que la distingue
    if(req&&!req.every(g=>g.some(x=>t.includes(norm(x))))) r[1]-=300;
    // el nombre o un sinónimo escrito tal cual gana siempre («napolitana», «septima disminuida»)
    else if(norm(NOMBRE(k))===t||(META.sinonimos[k]||[]).some(s=>norm(s)===t)) r[1]+=1000;
  }
  return res.sort((a,b)=>b[1]-a[1]||ORDEN_C.indexOf(a[0])-ORDEN_C.indexOf(b[0])).map(x=>x[0]);
}

const RELLENO=new Set(['acordes','acorde','pasajes','pasaje','fragmentos','con','y','e','de','solo','que','sin','en','chords','chord','passages','passage','with','and','of','only','that','without','in','the']);

function parsearFacetas(t){
  const usados=new Array(t.length).fill(false), hallados=[];
  for(const {a,id} of ALIAS){
    let i=t.indexOf(a);
    while(i>=0){
      const fin=i+a.length, bI=i===0||t[i-1]===' ', bF=fin===t.length||t[fin]===' ';
      if(bI&&bF&&!usados.slice(i,fin).some(Boolean)){usados.fill(true,i,fin);hallados.push({i,fin,id})}
      i=t.indexOf(a,i+1);
    }
  }
  hallados.sort((x,y)=>x.i-y.i);
  const porGrupo={}; for(const h of hallados) porGrupo[FAC[h.id].g]=h.id;
  const ids=ORDEN_G.map(g=>porGrupo[g]).filter(Boolean);
  const finUlt=hallados.length?hallados[hallados.length-1].fin:0;
  const libres=t.split('').map((c,i)=>usados[i]?' ':c).join('').split(' ').filter(w=>w&&!RELLENO.has(w));
  const cola=t.slice(finUlt).trim();
  const colaPal=new Set(cola.split(' '));
  const medioLibre=libres.some(w=>!colaPal.has(w));
  return {ids,cola,libres,medioLibre};
}
function etiquetaFacetas(ids){

function pasajes(ids,f,contar){
  const tests=ids.map(id=>FAC[id].test), L=f.L, out=[]; let total=0;
  for(const [idS,filas] of Object.entries(COMP.obras)){
    const id=+idS;
    if(!pasaObra(porId.get(id),f)) continue;
    let n=0, i=0;
    while(i<filas.length){
      const m0=filas[i][0], mf=m0+L-1;
      const s={nAc:0,tri:0,cua:0,otro:0,i0:0,i1:0,i2:0,i3:0,prest:0,sec:0,alt:0,modos:0,cambio:0};
      let j=i;
      for(;j<filas.length&&filas[j][0]<=mf;j++){
        const r=filas[j];
        s.nAc+=r[1];s.tri+=r[2];s.cua+=r[3];s.otro+=r[4];s.i0+=r[5];s.i1+=r[6];s.i2+=r[7];s.i3+=r[8];
        s.prest+=r[9];s.sec+=r[10];s.alt+=r[11];s.modos|=r[12];if(j>i&&r[13])s.cambio=1;
      }
      if(s.nAc>=Math.max(3,L)&&tests.every(t=>t(s))&&pasaForma(porId.get(id),f,m0,1,mf,null)){
        total++; n++;
        if(!contar&&n<=f.lim) out.push({frag:true,obra:id,ini:m0,fin:mf,tono:COMP.tonos[filas[i][14]],s});
        i=j;
      } else i++;
    }
  }
  return contar?total:out;
}

function tokensProg(texto){

  const SEXTA={it:'It6',fr:'Fr43',ger:'Ger65',gr:'Ger65'};
  const toks=String(texto).trim().replace(/[°º]/g,'o').split(/[\s,–—]+|(?<=[0-9IViv])-(?=[b#]?[IViv])/).filter(Boolean)
    .map(x=>x.replace(/^(It|Fr|Ger|Gr)\+6$/i,(m,a)=>SEXTA[a.toLowerCase()]).replace(/^Gr(?=\d|$)/,'Ger'));

    // a secas no es una búsqueda útil) y no es el nombre de un procedimiento («N6» → sexta napolitana)
    const t=norm(toks[0]);

async function xmlDe(o){
  if(xmlCache.has(o.m)) return xmlCache.get(o.m);
  if(!zips[o.pq]) zips[o.pq]=fetch(`scores/${o.pq}.json`).then(r=>r.json());
  const paquete=await zips[o.pq];
  // casi todas vienen comprimidas (.mxl); alguna (BWV 69/6) es MusicXML sin comprimir
  let bytes;
  if(paquete[o.m].startsWith('UEs')){
    const mxl=await JSZip.loadAsync(paquete[o.m],{base64:true});
    const nombre=Object.keys(mxl.files).find(n=>n.endsWith('.xml')&&!n.startsWith('META-INF'))||Object.keys(mxl.files).find(n=>n.endsWith('.musicxml'));
    bytes=await mxl.file(nombre).async('uint8array');
  } else {const bin=atob(paquete[o.m]); bytes=Uint8Array.from(bin,ch=>ch.charCodeAt(0))}
  // se quitan las etiquetas armónicas que traen algunos archivos de origen (<harmony>, p. ej. «C.I»):
  // Verovio las dibujaría sobre el pentagrama superior y duplicarían, en otra notación, los cifrados de abajo
  // algunas partituras (madrigales de Monteverdi) vienen en UTF-16: se detecta y se decodifica bien
  const utf16=(bytes[0]===0xFF&&bytes[1]===0xFE)||(bytes[0]===0xFE&&bytes[1]===0xFF)||bytes[1]===0||bytes[0]===0;
  const codif=!utf16?'utf-8':(bytes[0]===0xFE||bytes[0]===0)?'utf-16be':'utf-16le';
  let x=new TextDecoder(codif).decode(bytes).replace(/^\uFEFF/,'').replace(/(<\?xml[^>]*encoding=)(['"])utf-16\2/i,'$1$2UTF-8$2');
  x=x.replace(/<harmony\b[\s\S]*?<\/harmony>/g,'');
  // «dinámicas» que son solo signos sueltos — ( ) [ ] — restos de la conversión desde Humdrum (marcas de ligadura y
  // de paréntesis del **dynam): Verovio las dibujaría como texto bajo el pentagrama. Se quitan con su indicación si
  // se queda vacía; las dinámicas de verdad (p, cresc., (p)…) llevan letras y se conservan
  if(x.includes('<other-dynamics')){
    x=x.replace(/<other-dynamics>[^<A-Za-z0-9]*<\/other-dynamics>/g,'').replace(/<dynamics\b[^>]*>\s*<\/dynamics>/g,'')
       .replace(/<direction-type>\s*<\/direction-type>/g,'')
       .replace(/<direction\b[^>]*>(?:\s*(?:<sound\b[^>]*\/>|<offset>[^<]*<\/offset>|<staff>[^<]*<\/staff>|<voice>[^<]*<\/voice>))*\s*<\/direction>/g,'');
  }
  x=quitarExpresion(x);
  if((x.match(/<score-part\b/g)||[]).length===1) x=x.replace(/<part-name\b[^>]*>[\s\S]*?<\/part-name>/,'<part-name print-object="no"></part-name>').replace(/<part-abbreviation\b[^>]*>[\s\S]*?<\/part-abbreviation>/,'');
  if(o.reconstruida) x=Notacion.alteracionesRedundantes(ordenarVoces(x,o.src.inst)); else x=o.convertida?Notacion.alteracionesRedundantes(corregirClaves(x)):corregirClaves(x);
  // anacrusa: el análisis la numera 0 y algunas partituras la numeran 1; se alinea la partitura con el análisis
  if((await acordesDe(o.id)).some(c=>c.compas===0)) x=alinearAnacrusa(x);
  xmlCache.set(o.m,x); return x;
}
// Los ejemplos se muestran solo con notas, ritmos y ligaduras: se quitan dinámicas, reguladores, pedales, textos de
// expresión, metrónomos y articulaciones, que chocan con los cifrados y con las demás voces. Se conservan las
// ligaduras (<slur>, <tied>), los cambios de octava (<octave-shift>) y las fermatas (<fermata>), que marcan el final

function quitarExpresion(x){

// Claves de las partituras reconstruidas (DCML): la reconstrucción pone una sola clave por pentagrama para toda la
// pieza. Aquí se elige, compás a compás, la clave que pediría un copista: las propias del instrumento (violonchelo:
// fa, tenor y sol; viola: do en 3.ª y sol; tenor vocal: sol octava baja; teclado: sol y fa…), evitando pasajes con
// 3 o más líneas adicionales, sin cambios de un compás y cambiando solo en la barra de compás (programación dinámica).

function clavesDeInstrumento(nombre){
  const t=(nombre||'').toLowerCase();

  if(/viola\b|bratsche/.test(t)) return {c:['C3','G2'],d:'C3'};
  if(/violin|flute|flöte|oboe|recorder|clarinet|trumpet|cornet/.test(t)) return {c:['G2'],d:'G2'};
  if(/continuo|bassoon|fagott/.test(t)) return {c:['F4','C4'],d:'F4'};

  if(/tenor/.test(t)) return {c:['G2-1','F4','G2'],d:'G2-1',voz:1};
  if(/bass|basso|bajo/.test(t)) return {c:['F4','G2-1'],d:'F4',voz:1};
  if(/soprano|alto|mezzo|contralto|canto/.test(t)) return {c:['G2','G2-1'],d:'G2',voz:1};
  if(/voice|voce|stimme/.test(t)) return {c:['G2','G2-1','F4'],d:null,voz:1};

function ordenarVoces(xml,inst){

  try{asignarClaves(doc,inst||[],hijo)}catch(e){console.warn('claves',e)}

  for(const parte of doc.getElementsByTagName('part')){
    const claves={};

      for(const cl of m.getElementsByTagName('clef')){const nn=cl.getAttribute('number')||'1',oc=+(hijo(cl,'clef-octave-change')?.textContent||0);claves[nn]=(hijo(cl,'sign')?.textContent||'G')+(hijo(cl,'line')?.textContent||'2')+(oc?String(oc):'')}

        const alt=pi?(PASO[hijo(pi,'step')?.textContent]??0)+7*(+(hijo(pi,'octave')?.textContent||4)):null;

      }

    :`<div class="res">${filasC.length} posiciones · ${igual} coinciden · ${difCif} cifrado distinto · ${difTono} tonalidad distinta · ${difSeg} segmentación distinta (un análisis pone acorde y el otro no)${notas?'<br>'+notas:''}<br>Cada análisis se muestra con sus propias convenciones; la tabla no decide cuál es correcto.</div>`)

// parte del compás para leer: 1.6666… → 1⅔, 2.5 → 2½ (las partes vienen como fracciones de pulso)
function fmtParte(p){
  const n=+p; if(!isFinite(n)) return String(p??'');
  const e=Math.floor(n+1e-9), f=n-e, FR=[[1/4,'¼'],[1/3,'⅓'],[1/2,'½'],[2/3,'⅔'],[3/4,'¾']];
  if(f<1e-6) return String(e);
  const x=FR.find(([v])=>Math.abs(f-v)<0.01); return x?`${e}${x[1]}`:String(+n.toFixed(2));
}
// «cc. 288–288» → «c. 288»
const fmtCompases=(a,b)=>a===b||b==null?`${trd('c.','b.')} ${a}`:`${trd('cc.','bb.')} ${a}–${b}`;
// autores tal como los declara la fuente, sin la licencia ni la nota de conversión que algunos análisis llevan pegadas
function analistas(s){
  return String(s||'').replace(/\.?\s*Licen[cs]e[^.]*\.?/i,'').replace(/\.?\s*This file is automatically converted from\s*\S+/i,'')
    .replace(/\s*See https?:\/\/\S+/i,'').replace(/\s+/g,' ').replace(/[\s.]+$/,'').trim();
}
// licencia efectiva: un análisis de When in Rome convertido del DCML conserva la licencia del DCML (CC BY-NC-SA)
function licencia(src){
  const a=String(src.autores||'');
  if(/CC[- ]?BY[- ]?NC[- ]?SA/i.test(a)||/DCMLab\//.test(String(src.origen||'')))
    return 'CC BY-NC-SA 4.0'+(src.licencia&&!/NC/.test(src.licencia)?trd(' (análisis original del DCML)',' (original DCML analysis)'):'');
  return src.licencia||'';
}
function descripcionBusqueda(){
  if(!actual) return {nombre:'—',tipo:'',criterio:''};
  const regla=trd('Derivado por regla a partir del cifrado romano','Derived by rule from the Roman-numeral analysis');
  if(actual.t==='c'){const m=META.conceptos[actual.k]||{};return {nombre:NOMBRE(actual.k),tipo:regla,criterio:EN?DESC(actual.k):(m.criterio||m.desc||'')}}
  if(actual.t==='f') return {nombre:etiquetaFacetas(actual.ids),tipo:regla,criterio:actual.ids.map(id=>FAC[id].desc).join(' · ')+trd(` (pasajes de ${filtros().L} compases)`,` (${filtros().L}-bar passages)`)};
  if(actual.t==='p'){
    const gap=+$('#progGap').value, min=$('#progMin').value||actual.q.length, inv=$('#progInv').checked, fund=$('#progFund').checked;
    const partes=EN?['only what is written is required: quality (ø, o, +), figures (6, 7, 6/5, 4/3…) and added notes filter',
        inv?'inversions are ignored':fund?'a degree without figures (I, V) means root position; written inversions are exact':'a bare degree (ii, V, I) accepts any inversion, seventh or extension; written inversions are exact',
        'degree, accidental, secondary target and upper/lower case must match','the progression stays within one local key',
        gap?`up to ${gap} chord${gap>1?'s':''} in between`:'no chords in between',`at least ${min} chords`,'repeated chords count as one']
      :['solo se exige lo que se escribe: la cualidad (ø, o, +), las cifras (6, 7, 6/5, 4/3…) y las notas añadidas filtran',
        inv?'no se tienen en cuenta las inversiones':fund?'un grado sin cifra (I, V) es estado fundamental; las inversiones escritas son exactas':'un grado sin más (ii, V, I) admite cualquier inversión, séptima o extensión; las inversiones escritas son exactas',
        'el grado, la alteración, la dominante secundaria y la mayúscula/minúscula deben coincidir','la progresión no cruza un cambio de tonalidad local',
        gap?`hasta ${gap} acorde${gap>1?'s':''} intermedio${gap>1?'s':''}`:'sin acordes intermedios',`mínimo ${min} acordes`,'los acordes repetidos seguidos cuentan como uno'];
    return {nombre:trd('progresión ','progression ')+actual.q.join(' – '),tipo:trd('Coincidencia de sucesión de cifrados','Matching succession of chords'),criterio:partes.join('; ')};
  }

// cadena «A → B → C» de un ejemplo (cadencias, 6/4 cadencial, napolitana → V…): índices del primer y último acorde.
// El acorde del ejemplo (i) es el último (cadencias) o el primero (6/4 cadencial, secuencias…); solo se toma la cadena
// si todos sus acordes coinciden con la etiqueta (en las modulaciones la cadena son tonalidades): si no, [i, i]
function cadenaDe(h,ac,i){
  if(i<0||!h.etq||!/→/.test(h.etq.split(' · ')[0])) return [i,i];
  const toks=h.etq.split(' · ')[0].split('→').map(x=>x.trim()), k=toks.length-1;
  const es=(j,t)=>!!ac[j]&&(ac[j].orig===t||ac[j].rn===t), todos=a=>toks.every((t,n)=>es(a+n,t));
  if(todos(i)) return [i,i+k];
  if(todos(i-k)) return [i-k,i];
  return [i,i];
}

  if(i0<0) i0=ac.findIndex(x=>x.compas>=(h.compas||h.ini));
  let i1=i0;

      ${fila(trd('Posición','Position'),h.frag?fmtCompases(h.ini,h.fin):`${trd('c.','b.')} ${h.compas}, ${trd('parte','beat')} ${fmtParte(h.parte)}`)}${fila(trd('Tonalidad','Key'),esc(tonoEs(h.tono)))}${fila(trd('Forma','Form'),formaGV)}${fila(trd('Sección','Section'),formaV)}</dl>

let limitesNav={primero:0,ultimo:Infinity};
function moverVista(d){
  if(!seleccion) return;
  if(!seleccion.frag){   // acorde suelto: se desplaza la ventana de compases (sin perder el resalte del acorde)
    const m=+$('#margen').value, paso=seleccion.fin-seleccion.ini+1+2*m, h={...seleccion}, {primero,ultimo}=limitesNav;
    const nmin=Math.min(0,primero-h.ini+m), nmax=Math.max(0,ultimo-h.fin-m);
    h.desp=Math.max(nmin,Math.min(nmax,(h.desp||0)+d*paso));
    h.s=null; mostrar(h); return;
  }
  const L=seleccion.fin-seleccion.ini+1, h={...seleccion};
  h.ini+=d*L; h.fin+=d*L;
  if(h.obraEntera){if(h.ini<h.primero){h.ini=h.primero;h.fin=h.primero+L-1} if(h.fin>h.ultimo){h.fin=h.ultimo;h.ini=Math.max(h.primero,h.ultimo-L+1)}}
  else if(h.ini<0){h.ini=0;h.fin=L-1}
  h.s=null; mostrar(h);
}

  const es=`
  <h2>El proyecto</h2>
  <p class="entrada">Harmony Finder busca <strong>ejemplos reales de procedimientos armónicos</strong> en el repertorio —cadencias rotas, sextas aumentadas, modulaciones enarmónicas, dominantes secundarias, progresiones concretas— y muestra cada uno en la partitura, con su cifrado romano, interválico y funcional.</p>
  <p>Está pensado para la clase de armonía y de análisis: preparar ejemplos, encontrar modelos para un ejercicio o comprobar cómo resuelven distintos compositores un mismo recurso. Las búsquedas se combinan: un procedimiento con un compositor, una época, una tonalidad, una forma o una sección («sexta alemana en el desarrollo de las sonatas de Beethoven»).</p>
  <div class="no"><strong>Qué no es</strong>
    <p>No es un catálogo de análisis de obras. No sirve para buscar una pieza concreta y leer su análisis: muchas obras no están, y las que están es porque alguien publicó en abierto un análisis armónico completo de ellas. La pregunta a la que responde es <em>«¿dónde aparece este procedimiento?»</em>, no <em>«¿cómo se analiza esta obra?»</em>.</p></div>
  <h3>Qué hay dentro</h3>
  ${cifras}
  <p>El repertorio va del Renacimiento al siglo XX, con mucho más peso en el Barroco (sobre todo los corales de Bach) y en el Clasicismo y el Romanticismo. Estos son los compositores, con su número de obras:</p>
  ${lista}
  <h3>De dónde salen los análisis</h3>
  <p>Harmony Finder no analiza las obras por sí mismo: lee análisis hechos por especialistas y publicados en abierto, y localiza en ellos los procedimientos.</p>
  <ul>
    <li><a href="https://github.com/MarkGotham/When-in-Rome" target="_blank" rel="noopener">When in Rome</a> (Gotham et al.), que reúne en un solo formato análisis de varios proyectos: corales de Bach, sonatas y cuartetos de Beethoven, sonatas de Mozart, lieder, ejemplos de manuales de armonía…</li>
    <li><a href="https://github.com/DCMLab/distant_listening_corpus" target="_blank" rel="noopener">Distant Listening Corpus</a> del Digital and Cognitive Musicology Lab (EPFL), con cifrado romano y cadencias anotadas.</li>
  </ul>
  <p>Algunos procedimientos vienen marcados en el propio análisis; otros se deducen del cifrado (la sexta napolitana es un ♭II en primera inversión, y el ♭II en estado fundamental se busca aparte, por ejemplo), y las cadencias se afinan con rasgos de la partitura: metro, bajo, calderones, final de frase. Puede haber falsos positivos y ausencias. La ficha de cada ejemplo dice cómo se ha identificado y enlaza el análisis original.</p>

  <h3>Partituras</h3>
  <p>Las partituras vienen de OpenScore, del corpus de music21 o se reconstruyen a partir de las tablas de notas del DCML, y se graban en el navegador con Verovio. Al reconstruirlas pueden aparecer pequeñas imperfecciones de notación.</p>
  <h3>Estado y licencia</h3>
  <p>Es una <strong>versión alfa</strong>: el contenido y la interfaz pueden cambiar, y cualquier error que se detecte ayuda a mejorarla: puedes comunicarlo en el <a href="#buzon">buzón de errores y sugerencias</a>. La web puede usarse en español o en inglés y las búsquedas dan exactamente los mismos resultados en los dos idiomas. Licencias de las fuentes: When in Rome, CC BY-SA 4.0; DCML, CC BY-NC-SA 4.0; Taking Form, MIT; BPSD, CC BY 4.0; Mozart Expositional Punctuation Corpus, CC0. Por la licencia de los análisis del DCML, los datos solo pueden usarse sin fines comerciales, citando la fuente y compartiendo igual. El código está en <a href="https://github.com/enavcap/HarmonyFinder" target="_blank" rel="noopener">GitHub</a>.</p>
  <p class="firma">Harmony Finder es un proyecto de <strong>Ezequiel Navarrete</strong>.</p>`;
  const en=`
  <h2>The project</h2>
  <p class="entrada">Harmony Finder looks for <strong>real examples of harmonic devices</strong> in the repertoire —deceptive cadences, augmented sixths, enharmonic modulations, secondary dominants, specific progressions— and shows each one in the score, with Roman-numeral, figured-bass and functional analysis.</p>
  <p>It is meant for harmony and analysis classes: preparing examples, finding models for an exercise, or seeing how different composers handle the same device. Searches can be combined: a device with a composer, a period, a key, a form or a section (“German sixth in the development of Beethoven’s sonatas”).</p>
  <div class="no"><strong>What it is not</strong>
    <p>It is not a catalogue of analysed works. It is not for looking up a particular piece and reading its analysis: many works are missing, and the ones included are there because someone published a complete open harmonic analysis of them. The question it answers is <em>“where does this device occur?”</em>, not <em>“how is this piece analysed?”</em>.</p></div>
  <h3>What is inside</h3>
  ${cifras}
  <p>The repertoire runs from the Renaissance to the 20th century, weighted heavily towards the Baroque (above all Bach’s chorales) and towards the Classical and Romantic periods. These are the composers, with their number of works:</p>
  ${lista}
  <h3>Where the analyses come from</h3>
  <p>Harmony Finder does not analyse the music itself: it reads analyses made by specialists and published openly, and finds the devices in them.</p>
  <ul>
    <li><a href="https://github.com/MarkGotham/When-in-Rome" target="_blank" rel="noopener">When in Rome</a> (Gotham et al.), which brings analyses from several projects into one format: Bach chorales, Beethoven sonatas and quartets, Mozart sonatas, lieder, textbook examples…</li>
    <li>The <a href="https://github.com/DCMLab/distant_listening_corpus" target="_blank" rel="noopener">Distant Listening Corpus</a> of the Digital and Cognitive Musicology Lab (EPFL), with Roman numerals and annotated cadences.</li>
  </ul>
  <p>Some devices are marked in the analysis itself; others are derived from the Roman numerals (a Neapolitan sixth is a ♭II in first inversion, for instance), and cadences are refined with features of the score: metre, bass, fermatas, phrase endings. There can be false positives and gaps. Each example’s sheet says how it was identified and links to the original analysis.</p>
  <h3>Form and sections</h3>
  <p>The overall form (sonata form, rondo, minuet and trio…) is only assigned when a source states it: <a href="https://github.com/MarkGotham/Taking-Form" target="_blank" rel="noopener">Taking Form</a>, <a href="https://transactions.ismir.net/articles/196" target="_blank" rel="noopener">BPSD</a> for Beethoven, the <a href="https://github.com/corpusTAU/The-Mozart-Expositional-Punctuation-Corpus" target="_blank" rel="noopener">Mozart Expositional Punctuation Corpus</a>, the movement title or the genre of the collection. So far ${nn0(nForma)} of ${nn0(porMov.size)} movements have one. Sections (exposition, development, recapitulation…) are only available for ${nn0(nSecc)} movements of Beethoven and Mozart sonatas.</p>

  <p class="firma">Harmony Finder is a project by <strong>Ezequiel Navarrete</strong>.</p>`;
  $('#proyecto').innerHTML=EN?en:es;
}

  $('#bzOtro').onclick=()=>pintarBuzon();
}
// pestañas: Buscador / El proyecto / Buzón (#proyecto, #buzon en la dirección)
function ruta(){
  const h=location.hash, pr=h==='#proyecto', bz=h==='#buzon';
  if(pr&&!$('#proyecto').innerHTML) pintarProyecto();
  if(bz&&!$('#buzon').innerHTML) pintarBuzon();
  else if(bz) $('#bzTec')&&($('#bzTec').textContent=bzTecnico());
  $('#proyecto').hidden=!pr; $('#buzon').hidden=!bz; document.querySelector('main').hidden=pr||bz; if(pr||bz) $('#colecciones').hidden=true;
  $('#tabProyecto').setAttribute('aria-current',pr?'page':'false'); $('#tabBuzon').setAttribute('aria-current',bz?'page':'false'); $('#tabBuscar').setAttribute('aria-current',pr||bz?'false':'page');
  if(pr||bz) window.scrollTo(0,0);
}
// al ir al buzón desde el buscador se guarda lo que había abierto
document.addEventListener('click',e=>{const a=e.target.closest('a[href="#buzon"]');if(a&&!document.querySelector('main').hidden) bzCapturar()},true);
$('#tabBuscar').onclick=e=>{e.preventDefault();history.pushState(null,'',location.pathname+location.search);ruta()};
window.addEventListener('hashchange',ruta); window.addEventListener('popstate',ruta);
pintarPortada(); ruta();
pintarEtiquetas();
(async()=>{let r=null;try{r=JSON.parse(sessionStorage.getItem('restaurar')||'null');sessionStorage.removeItem('restaurar')}catch(e){}
  await new Promise(ok=>setTimeout(ok));            // aplicarURL se define más abajo
  if(await aplicarURL()) return;
  if(!r) return;
  for(let [id,v] of Object.entries(r.filtros||{})){if(!v)continue;const sel=$('#'+id); if(id==='compositor'&&COMP_OTRO[v]&&!comps.includes(v)) v=COMP_OTRO[v];
    if(sel.tagName==='SELECT'&&![...sel.options].some(op=>op.value===v)){const op=document.createElement('option');op.value=v;sel.append(op)}
    sel.value=v; if(id==='compositor') rellenarObras()}
  if(r.filtros&&r.filtros.obraSel) $('#obraSel').value=r.filtros.obraSel;
  if(r.actual) ejecutar(r.actual); else if(hayFiltros()) relanzar();
})();
// ============ estado en la dirección (?c=…&compositor=…&ej=…): recargar, atrás/adelante, compartir, cambiar de idioma
// c = procedimiento · p = progresión · f = tipos de acorde · filtros con el nombre de su campo · ej = ejemplo abierto
// (análisis.compás.parte, o análisis.inicio-fin si es un pasaje). Las pestañas siguen en el #.
let restaurando=false, urlActual=location.search;
function estadoParams(){
  const u=new URLSearchParams();
  if(actual?.t==='c') u.set('c',actual.k);
  else if(actual?.t==='p') u.set('p',actual.q.join(' '));
  else if(actual?.t==='f') u.set('f',actual.ids.join(','));
  for(const id of CAMPOS){const v=$('#'+id).value; if(v) u.set(id,v)}
  if(seleccion&&!$('#vista').hidden){const h=seleccion;
    u.set('ej',h.frag&&!h.prog?`${h.obra}.${h.ini}-${h.fin}`:`${h.obra}.${h.compas}.${h.parte}`)}
  const t=u.toString(); return t?'?'+t:'';
}
function escribirURL(nueva=true){
  if(restaurando) return;
  const s=estadoParams(); if(s===location.search) return;
  const url=location.pathname+s+location.hash;
  try{nueva?history.pushState({hf:1},'',url):history.replaceState({hf:1},'',url)}catch(e){}
  urlActual=s;
}
function buscarEjemplo(ej){
  const m=String(ej||'').match(/^(\d+)\.(\d+)(?:\.([\d.]+)|-(\d+))$/); if(!m) return null;
  const obra=+m[1];
  if(m[4]!=null){const ini=+m[2],fin=+m[4]; return filas.find(h=>h.obra===obra&&h.ini===ini&&h.fin===fin)||(porId.get(obra)?{frag:true,obra,ini,fin,compas:ini,parte:1,tono:''}:null)}
  const compas=+m[2], parte=+m[3];
  const h=filas.find(x=>(x.obra===obra||(x.otros||[]).some(y=>y.obra===obra))&&x.compas===compas&&Math.abs(x.parte-parte)<1e-6);
  if(h) return h.obra===obra?h:{...h,obra};
  return porId.get(obra)?{obra,compas,parte,ini:compas,fin:compas,tono:'',etq:''}:null;
}
async function aplicarURL(vaciar=false){
  const u=new URLSearchParams(location.search);
  if(![...u.keys()].length){            // dirección sin búsqueda: al volver atrás hasta ella, se deja todo vacío
    if(vaciar){restaurando=true;try{for(const id of CAMPOS) $('#'+id).value='';rellenarObras();q.value='';reiniciar();refrescarMenus()}finally{restaurando=false;urlActual=location.search}}
    return false;
  }
  restaurando=true;
  try{
    for(const id of CAMPOS){let v=u.get(id)||''; if(id==='compositor'&&v&&COMP_OTRO[v]&&!comps.includes(v)) v=COMP_OTRO[v];
      const sel=$('#'+id); if(v&&sel.tagName==='SELECT'&&![...sel.options].some(op=>op.value===v)){const op=document.createElement('option');op.value=v;sel.append(op)}
      sel.value=v; if(id==='compositor') rellenarObras()}
    if(u.get('obraSel')) $('#obraSel').value=u.get('obraSel');
    cuentaCache.clear();
    const o=u.get('c')&&META.conceptos[u.get('c')]?{t:'c',k:u.get('c')}:u.get('p')?{t:'p',q:u.get('p').split(' ').filter(Boolean)}
      :u.get('f')?{t:'f',ids:u.get('f').split(',').filter(id=>FAC[id])}:null;
    if(o) await ejecutar(o); else if(hayFiltros()) await ejecutar({t:'o',comp:$('#compositor').value}); else reiniciar();
    const h=buscarEjemplo(u.get('ej'));
    if(h){seleccion=h; await mostrar(h)} else {$('#vista').hidden=true; seleccion=null}
  }finally{restaurando=false; urlActual=location.search}
  return true;
}
window.addEventListener('popstate',()=>{if(location.search!==urlActual) aplicarURL(true)});
// acceso de solo lectura para las pruebas automáticas
window.__prueba={OBRAS,porId,porMov,NOMBRE,textoOpcion,tokensProg,elegir,cerrar,mostrar,quitar,ordenarVoces,despejarSilencios,acordesDe,xmlDe,estructura,alinear,situar,parteDe,ocurrencias,desajustes,interpretar,parsearFacetas,extraerForma,sugerir,enviar,ejecutar,LANG,
  fijarTexto:t=>{q.value=t},get actual(){return actual},
  get opciones(){return opciones},get filas(){return filas},fijarSeleccion:h=>{seleccion=h}};
})();
